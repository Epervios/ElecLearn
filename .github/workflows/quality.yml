name: Qualité ElecLearn
on:
  push:
  pull_request:
jobs:
  statique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyse syntaxique
        run: npm run check
      - name: Contrôles des chapitres et questionnaires
        run: npm test

  navigateur:
    needs: statique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Parcours responsive et PWA
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/eleclearn-http.log 2>&1 &
          node tests/browser-smoke.mjs
      - name: Capture de la version mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eleclearn-mobile
          path: tests/artifacts/
          if-no-files-found: ignore
